<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Load Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Page content sits beneath the overlay -->
  <main class="content">
    <h1>Hello, World.</h1>
    <p>Revealed through expanding circles.</p>
  </main>

  <!--
    SVG overlay: a black rect masked by a white background with growing black
    circles. White in a mask = show the rect (black); black = hide it (hole).
  -->
  <svg id="overlay" aria-hidden="true">
    <defs>
      <mask id="reveal" maskUnits="userSpaceOnUse">
        <rect id="reveal-bg" fill="white"/>
        <circle id="rc0" fill="black"/>
        <circle id="rc1" fill="black"/>
        <circle id="rc2" fill="black"/>
        <circle id="rc3" fill="black"/>
        <circle id="rc4" fill="black"/>
      </mask>
    </defs>
    <rect id="overlay-rect" width="100%" height="100%" fill="black" mask="url(#reveal)"/>
  </svg>

  <script src="script.js"></script>
</body>
</html>
